<style>
/* Layout: Soft2Cloud house style — dark navy rail with modules, light working pane; on phones the rail becomes a bottom tab bar.
   Identity: Soft2Cloud royal blue for actions, amber for things that need attention, navy for structure. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #eef1f6; --ink: #152033; --muted: #5d6a80; --line: #dde3ec;
  --accent: #1f4fd1; --accent-ink: #ffffff; --accent-soft: #e6edfd;
  --plum: #1f4fd1; --plum-soft: #e6edfd;
  --sun: #c97a06; --sun-ink: #1b1205; --sun-soft: #fdf2df;
  --ok: #17824f; --ok-soft: #e1f4ea; --warn: #b06a00; --warn-soft: #fdf0d8; --bad: #c2352b; --bad-soft: #fbe7e5; --info: #1f4fd1; --info-soft: #e6edfd;
  --rail: #0f1a2c; --rail-ink: #c9d3e4; --rail-active: #ffffff; --rail-line: rgba(255,255,255,.08);
  --shadow: 0 1px 2px rgba(15, 26, 44, .06), 0 10px 28px rgba(15, 26, 44, .10);

  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1322; --surface: #141e31; --surface-2: #1b2740; --ink: #e7ecf5; --muted: #93a0b8; --line: #26324a;
    --accent: #6f95ff; --accent-ink: #081127; --accent-soft: #1b2a4f; --plum: #8eabff; --plum-soft: #1b2a4f;
    --sun: #f0a93b; --sun-ink: #1b1205; --sun-soft: #33270f;
    --ok: #4fc68a; --ok-soft: #113022; --warn: #f2b04c; --warn-soft: #352610; --bad: #ff7c70; --bad-soft: #3a1716; --info: #6f95ff; --info-soft: #1b2a4f;
    --rail: #070d18; --rail-ink: #9fb0cc; --rail-active: #ffffff; --rail-line: rgba(255,255,255,.07);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1322; --surface: #141e31; --surface-2: #1b2740; --ink: #e7ecf5; --muted: #93a0b8; --line: #26324a;
  --accent: #6f95ff; --accent-ink: #081127; --accent-soft: #1b2a4f; --plum: #8eabff; --plum-soft: #1b2a4f;
  --sun: #f0a93b; --sun-ink: #1b1205; --sun-soft: #33270f;
  --ok: #4fc68a; --ok-soft: #113022; --warn: #f2b04c; --warn-soft: #352610; --bad: #ff7c70; --bad-soft: #3a1716; --info: #6f95ff; --info-soft: #1b2a4f;
  --rail: #070d18; --rail-ink: #9fb0cc; --rail-active: #ffffff; --rail-line: rgba(255,255,255,.07);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.12rem; }
h3 { font-size: .98rem; }
p { margin: 0; }
a { color: var(--info); }
.num, .money { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; background: var(--rail); color: var(--rail-ink); border-right: 0; display: flex; flex-direction: column; padding: 18px 12px; gap: 14px; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 12px; border-bottom: 1px solid var(--rail-line); }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: #1f4fd1; color: #ffffff; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.15rem; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.08rem; line-height: 1.1; color: var(--rail-active); letter-spacing: .01em; }
.brand-sub { font-size: .68rem; color: var(--rail-ink); letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--rail-ink); font-weight: 500; }
.nav button:hover { background: rgba(255,255,255,.06); color: var(--rail-active); }
.nav button.on { background: rgba(255,255,255,.11); color: var(--rail-active); font-weight: 600; box-shadow: inset 3px 0 0 #6f95ff; }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .badge { margin-left: auto; }
.side-foot { margin-top: auto; font-size: .75rem; color: var(--rail-ink); padding: 10px 8px 0; border-top: 1px solid var(--rail-line); display: flex; flex-direction: column; gap: 6px; }
.stamp { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: #8eabff; }
.main { min-width: 0; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grow { flex: 1; min-width: 0; }

/* Banner */
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--sun-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--sun) 35%, transparent); font-size: .9rem; }
.banner.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 30%, transparent); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .d { font-size: .8rem; color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; font-size: .9rem; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.plum { background: var(--plum); border-color: var(--plum); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { padding: 5px 9px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.wa { color: #12814a; }
:root[data-theme="dark"] .wa { color: #4fd18f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wa { color: #4fd18f; } }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.plum { background: var(--plum-soft); color: var(--plum); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--sun); color: var(--sun-ink); font-size: .72rem; font-weight: 700; display: inline-grid; place-items: center; font-family: var(--f-mono); }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=tel], input[type=email], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 0;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 0; border-color: var(--accent); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--plum); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface); flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 7px; font-size: .84rem; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--plum); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); }

/* Tables */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow p { overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.datebox { width: 46px; flex: none; text-align: center; border-radius: 9px; background: var(--surface-2); padding: 4px 0; }
.datebox b { display: block; font-family: var(--f-display); font-size: 1.25rem; line-height: 1.1; font-weight: 400; }

  useLocal() {

/* ---------- domain ---------- */
const hallById = (id) => S.config.halls.find((h) => h.id === id);
const pkgById = (id) => S.config.packages.find((p) => p.id === id);
const addonById = (id) => S.config.addons.find((a) => a.id === id);
const vendorById = (id) => S.config.vendors.find((v) => v.id === id);
const bookingById = (id) => S.bookings.find((b) => b.id === id);

function calc(b) {
  const st = S.config.settings, hall = hallById(b.hallId), pkg = pkgById(b.packageId);
  const guests = +b.guests || 0;
  const rent = hall ? Math.round((+hall.rent || 0) * (b.slot === 'full' ? 1.75 : 1)) : 0;
  const pkgAmt = pkg ? (pkg.type === 'perHead' ? (+pkg.price || 0) * guests : (+pkg.price || 0)) : 0;
  let addAmt = 0; const addLines = [];
  (b.addons || []).forEach((a) => {
    const ad = addonById(a.id); if (!ad) return;
    const qty = ad.unit === 'perHead' ? guests : Math.max(1, +a.qty || 1);
    const amt = (+ad.price || 0) * qty; addAmt += amt;
    addLines.push({ name: ad.name, qty, unit: ad.unit, price: +ad.price || 0, amt });
  });
  const subtotal = rent + pkgAmt + addAmt;
  const discount = Math.min(+b.discount || 0, subtotal);
  const taxable = subtotal - discount;
  const tax = Math.round(taxable * (+st.taxPct || 0) / 100);
  const total = taxable + tax;
  const paid = (b.payments || []).reduce((s, p) => s + (+p.amount || 0), 0);
  const deposit = Math.round(total * (+st.depositPct || 0) / 100);
  const balanceDue = b.date ? addDays(b.date, -(+st.reminderDays || 0)) : null;
  return { hall, pkg, guests, rent, pkgAmt, addAmt, addLines, subtotal, discount, tax, total, paid, balance: Math.max(0, total - paid), deposit, balanceDue };
}
function effStatus(b) {
  if (b.status === 'cancelled') return 'cancelled';
  if (b.status === 'hold') return (b.holdUntil && Date.now() < new Date(b.holdUntil).getTime()) ? 'hold' : 'expired';
  if (b.date && b.date < todayISO()) return 'completed';
  return 'confirmed';
}
const BLOCKING = ['hold', 'confirmed', 'completed'];
const slotsOverlap = (a, b) => a === 'full' || b === 'full' || a === b;
function conflictsFor(b) {
  return S.bookings.filter((x) => x.id !== b.id && x.hallId === b.hallId && x.date === b.date && BLOCKING.includes(effStatus(x)) && slotsOverlap(x.slot, b.slot));
}
function slotState(hallId, date, slot) {
  const hits = S.bookings.filter((x) => x.hallId === hallId && x.date === date && BLOCKING.includes(effStatus(x)) && slotsOverlap(x.slot, slot));
  if (!hits.length) return { state: 'free' };
  const conf = hits.find((x) => effStatus(x) !== 'hold');
  return { state: conf ? 'taken' : 'held', booking: conf || hits[0] };
}
function freeHalls(date, slot, guests) {
  return S.config.halls.filter((h) => slotState(h.id, date, slot).state === 'free' && (!guests || +h.capacity >= +guests));
}
function payPlan(b) {
  const c = calc(b), st = effStatus(b);
  if (['cancelled', 'expired'].includes(st) || c.total <= 0) return { key: 'none', c };
  if (c.balance <= 0) return { key: 'paid', c };
  let amount, due, label;
  if (c.paid < c.deposit) {
    amount = c.deposit - c.paid; label = 'Deposit';
    due = st === 'hold' ? iso(new Date(b.holdUntil)) : addDays(iso(new Date(b.confirmedAt || b.createdAt || Date.now())), 3);
  } else { amount = c.balance; label = 'Balance'; due = c.balanceDue; }
  if (due > b.date) due = b.date;
  const t = todayISO();
  const key = due < t ? 'overdue' : (daysBetween(t, due) <= 7 ? 'soon' : 'ok');
  return { key, amount, due, label, c };
}
function statusPill(b) {
  const s = effStatus(b);
  const map = { hold: ['warn', 'On hold · ' + untilText(b.holdUntil)], expired: ['bad', 'Hold expired'], confirmed: ['ok', 'Confirmed'], completed: ['plum', 'Completed'], cancelled: ['', 'Cancelled'] };
  const [cls, txt] = map[s]; return '<span class="pill ' + cls + '">' + esc(txt) + '</span>';
}
function payPill(b) {
  const p = payPlan(b);
  if (p.key === 'none') return '';
  if (p.key === 'paid') return '<span class="pill ok">Paid in full</span>';
  if (p.key === 'overdue') return '<span class="pill bad">' + p.label + ' overdue</span>';
  if (p.key === 'soon') return '<span class="pill warn">' + p.label + ' due ' + fmtShort(p.due) + '</span>';
  return '<span class="pill info">' + p.label + ' due ' + fmtShort(p.due) + '</span>';
}

  return pre + '-' + (max + 1);

function upcoming(days) {
  const t = todayISO(), end = addDays(t, days);
  return S.bookings.filter((b) => b.date >= t && b.date <= end && ['hold', 'confirmed'].includes(effStatus(b))).sort((a, b) => (a.date + a.slot).localeCompare(b.date + b.slot));
}
function attentionItems() {
  const items = [], t = todayISO();
  S.inquiries.filter((q) => q.status === 'new').sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach((q) => items.push({ sev: 'warn', icon: 'inbox', text: 'Reply to <b>' + esc(q.name) + '</b> about ' + esc(q.eventType || 'an event') + ' on ' + fmtShort(q.date), meta: 'Inquiry · ' + ago(q.createdAt), act: 'openInq', id: q.id }));
  S.bookings.forEach((b) => {
    const st = effStatus(b), c = calc(b);
    if (st === 'hold') items.push({ sev: 'warn', icon: 'clock', text: 'Hold for <b>' + esc(b.customer.name) + '</b> · ' + esc(c.hall?.name || '') + ' ' + fmtShort(b.date), meta: untilText(b.holdUntil) + ' · deposit ' + money(c.deposit), act: 'openBk', id: b.id });
    if (st === 'expired') items.push({ sev: 'bad', icon: 'clock', text: 'Hold expired for <b>' + esc(b.customer.name) + '</b> · ' + fmtShort(b.date), meta: 'Confirm or release the date', act: 'openBk', id: b.id });
    if (st === 'confirmed') {
      const p = payPlan(b);
      if (p.key === 'overdue') items.push({ sev: 'bad', icon: 'cash', text: '<b>' + money(p.amount) + '</b> ' + p.label.toLowerCase() + ' overdue from ' + esc(b.customer.name), meta: 'Was due ' + fmtShort(p.due), act: 'openBk', id: b.id, tab: 'payments' });
      if (!b.contract?.signedAt) items.push({ sev: 'info', icon: 'pen', text: 'Contract not signed · <b>' + esc(b.customer.name) + '</b>', meta: fmtShort(b.date) + ' · send for e-signature', act: 'openBk', id: b.id, tab: 'contract' });
      if (daysBetween(t, b.date) <= 7 && !(b.checklist || []).length) items.push({ sev: 'info', icon: 'list', text: 'No event-day checklist for <b>' + esc(b.customer.name) + '</b>', meta: fmtShort(b.date), act: 'openBk', id: b.id, tab: 'checklist' });
    }
  });
  const order = { bad: 0, warn: 1, info: 2 };
  return items.sort((a, b) => order[a.sev] - order[b.sev]);
}

  const c = calc(b), d = parseISO(b.date);
  return '<div class="li" style="cursor:pointer" data-act="openBk" data-id="' + b.id + '"><div class="datebox"><b>' + d.getDate() + '</b><span>' + MO[d.getMonth()] + '</span></div>' +
    '<div class="grow"><p><b>' + esc(b.customer.name) + '</b> · ' + esc(b.eventType) + '</p><p class="small muted"><span class="dot" style="background:' + esc(c.hall?.color || '#999') + '"></span> ' + esc(c.hall?.name || '') + ' · ' + SLOT_NAMES[b.slot] + ' · ' + b.guests + ' guests</p></div>' +
    '<div class="stack" style="align-items:flex-end;gap:4px">' + statusPill(b) + (can('money') ? payPill(b) : '') + '</div></div>';
}
function aiPanel() {
  return '';
  return '<section class="panel"><div class="panel-head"><div><h2>Ask VenueDesk AI</h2><p class="small muted">Questions about your bookings, money and free dates. Answers use your own Claude account.</p></div><span class="ai-tag">' + icon('spark', 14) + 'AI</span></div>' +
    '<div class="row"><input type="text" id="aiQ" class="grow" placeholder="Which Saturdays in the next two months are still free in the Grand Hall?" style="flex:1;min-width:200px"><button class="btn plum" data-act="aiAsk">' + icon('send') + 'Ask</button></div>' +
    '<div class="row small" style="margin-top:8px">' + ['Who owes us money this month?', 'Summarise next week for the staff briefing', 'Which package earns the most?'].map((q) => '<button class="btn sm ghost" data-act="aiPreset" data-q="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>' +
    '<div class="ai-out" id="aiOut" style="margin-top:10px" hidden></div></section>';
}

/* ---------- Calendar ---------- */
VIEWS.calendar = function () {
  const ms = S.ui.calMonth, d0 = parseISO(ms), t = todayISO();
  const start = addDays(ms, -d0.getDay());
  const halls = S.config.halls;
  const filt = S.ui.hallFilter;
  let h = pageHead(MONTHS[d0.getMonth()] + ' ' + d0.getFullYear(), 'Tap a day to see which halls and slots are free.',
    '<button class="btn" data-act="calNav" data-n="-1" aria-label="Previous month">' + icon('left') + '</button><button class="btn" data-act="calToday">Today</button><button class="btn" data-act="calNav" data-n="1" aria-label="Next month">' + icon('right') + '</button><button class="btn primary" data-act="newBk">' + icon('plus') + tr('newBooking') + '</button>');
  h += '<div class="spread"><div class="seg">' + '<button data-act="hallFilter" data-v="all" class="' + (filt === 'all' ? 'on' : '') + '">All halls</button>' + halls.map((x) => '<button data-act="hallFilter" data-v="' + x.id + '" class="' + (filt === x.id ? 'on' : '') + '">' + esc(x.name) + '</button>').join('') + '</div>' +
    '<div class="legend">' + halls.map((x) => '<span><i class="dot" style="background:' + esc(x.color) + '"></i>' + esc(x.name) + '</span>').join('') + '<span><i class="dot" style="background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px)"></i>On hold</span></div></div>';
  h += '<div class="cal" role="grid">' + WD.map((w) => '<div class="wd">' + w + '</div>').join('');
  for (let i = 0; i < 42; i++) {
    const day = addDays(start, i), dd = parseISO(day);
    if (i >= 35 && dd.getMonth() !== d0.getMonth()) break;
    const list = S.bookings.filter((b) => b.date === day && BLOCKING.includes(effStatus(b)) && (filt === 'all' || b.hallId === filt)).sort((a, b) => a.slot.localeCompare(b.slot));
    const hallsToCheck = filt === 'all' ? halls : halls.filter((x) => x.id === filt);
    const full = hallsToCheck.length && hallsToCheck.every((x) => slotState(x.id, day, 'evening').state !== 'free' && slotState(x.id, day, 'morning').state !== 'free');
    h += '<div class="day' + (dd.getMonth() !== d0.getMonth() ? ' out' : '') + (day === t ? ' today' : '') + (full ? ' full' : '') + '" data-act="openDay" data-d="' + day + '" role="gridcell" tabindex="0" aria-label="' + fmtDate(day) + ', ' + list.length + ' bookings">' +
      '<span class="dn">' + dd.getDate() + '</span>' +
      list.slice(0, 3).map((b) => { const c = calc(b); return '<div class="chip' + (effStatus(b) === 'hold' ? ' hold' : '') + '" style="--c:' + esc(c.hall?.color || '#888') + '" title="' + esc(b.customer.name + ' · ' + (c.hall?.name || '') + ' · ' + SLOT_NAMES[b.slot]) + '">' + (b.slot === 'morning' ? 'D ' : b.slot === 'full' ? 'F ' : 'E ') + esc(b.customer.name) + '</div>'; }).join('') +
      (list.length > 3 ? '<span class="more">+' + (list.length - 3) + ' more</span>' : '') + '</div>';
  }
  h += '</div><p class="small muted">D = day slot (' + esc(S.config.settings.slots.morning) + '), E = evening (' + esc(S.config.settings.slots.evening) + '), F = full day. Shaded days are fully booked.</p>';
  return h;
};

/* ---------- Bookings ---------- */
VIEWS.bookings = function () {
  const f = S.ui.bkFilter, q = S.ui.bkSearch.trim().toLowerCase(), t = todayISO();
  let list = S.bookings.slice();
  const by = { upcoming: (b) => b.date >= t && ['hold', 'confirmed'].includes(effStatus(b)), holds: (b) => ['hold', 'expired'].includes(effStatus(b)), past: (b) => effStatus(b) === 'completed', cancelled: (b) => effStatus(b) === 'cancelled', all: () => true };
  list = list.filter(by[f]);
  if (q) list = list.filter((b) => [b.code, b.customer.name, b.customer.phone, b.eventType, hallById(b.hallId)?.name].join(' ').toLowerCase().includes(q));
  list.sort((a, b) => f === 'past' || f === 'cancelled' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
  const counts = Object.fromEntries(Object.keys(by).map((k) => [k, S.bookings.filter(by[k]).length]));
  let h = pageHead(tr('bookings'), S.bookings.length + ' bookings on record', '<button class="btn" data-act="exportCsv">' + icon('dl') + 'Export CSV</button><button class="btn primary" data-act="newBk">' + icon('plus') + tr('newBooking') + '</button>');
  h += '<div class="spread"><div class="seg">' + [['upcoming', 'Upcoming'], ['holds', 'Holds'], ['past', 'Completed'], ['cancelled', 'Cancelled'], ['all', 'All']].map(([k, l]) => '<button data-act="bkFilter" data-v="' + k + '" class="' + (f === k ? 'on' : '') + '">' + l + ' <span class="muted num">' + counts[k] + '</span></button>').join('') + '</div>' +
    '<input type="search" id="bkSearch" placeholder="Search name, phone, code…" value="' + esc(S.ui.bkSearch) + '" style="max-width:280px"></div>';
  h += '<section class="panel">' + (list.length ? '<div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Event date</th><th>Client</th><th>Hall · slot</th><th class="r">Guests</th><th class="r">Total</th><th class="r">Balance</th><th>Status</th></tr></thead><tbody>' +
    list.map((b) => { const c = calc(b); return '<tr class="click" data-act="openBk" data-id="' + b.id + '"><td class="num">' + esc(b.code) + '</td><td>' + fmtDate(b.date) + '</td><td><b>' + esc(b.customer.name) + '</b><div class="small muted">' + esc(b.eventType) + ' · ' + esc(b.customer.phone || '') + '</div></td><td><span class="dot" style="background:' + esc(c.hall?.color || '#888') + '"></span> ' + esc(c.hall?.name || '—') + '<div class="small muted">' + SLOT_NAMES[b.slot] + '</div></td><td class="r num">' + b.guests + '</td><td class="r money">' + money(c.total) + '</td><td class="r money">' + money(c.balance) + '</td><td><div class="stack" style="gap:4px;align-items:flex-start">' + statusPill(b) + payPill(b) + '</div></td></tr>'; }).join('') +
    '</tbody></table></div>' : '<div class="empty"><p>No bookings match this view.</p><button class="btn primary sm" data-act="newBk">Add a booking</button></div>') + '</section>';
  return h;
};

/* ---------- Inquiries ---------- */
VIEWS.inquiries = function () {
  const f = S.ui.inqFilter;
  const by = { open: (q) => ['new', 'replied'].includes(q.status), new: (q) => q.status === 'new', replied: (q) => q.status === 'replied', converted: (q) => q.status === 'converted', lost: (q) => q.status === 'lost', all: () => true };
  const list = S.inquiries.filter(by[f]).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const replied = S.inquiries.filter((q) => q.repliedAt);
  const avgMin = replied.length ? replied.reduce((s, q) => s + (new Date(q.repliedAt) - new Date(q.createdAt)) / 60000, 0) / replied.length : null;
  const closed = S.inquiries.filter((q) => ['converted', 'lost'].includes(q.status));
  const conv = closed.length ? Math.round(100 * closed.filter((q) => q.status === 'converted').length / closed.length) : null;
  let h = pageHead(tr('inquiries'), 'Every question from WhatsApp, phone, Instagram and your booking site, in one inbox.', '<button class="btn primary" data-act="newInq">' + icon('plus') + tr('newInquiry') + '</button>');
  h += '<div class="kpis">' + kpi('Waiting for a reply', S.inquiries.filter((q) => q.status === 'new').length, 'Answer within the hour to win the booking') +
    kpi('Average first reply', avgMin == null ? '—' : (avgMin < 60 ? Math.round(avgMin) + ' min' : (avgMin / 60).toFixed(1) + ' h'), 'From inquiry to first answer') +
    kpi('Converted', conv == null ? '—' : conv + '%', 'Of inquiries that reached a decision') +
    kpi('This month', S.inquiries.filter((q) => q.createdAt.slice(0, 7) === todayISO().slice(0, 7)).length, 'New inquiries received') + '</div>';
  h += '<div class="seg">' + [['open', 'Open'], ['new', 'New'], ['replied', 'Replied'], ['converted', 'Booked'], ['lost', 'Lost'], ['all', 'All']].map(([k, l]) => '<button data-act="inqFilter" data-v="' + k + '" class="' + (f === k ? 'on' : '') + '">' + l + ' <span class="muted num">' + S.inquiries.filter(by[k]).length + '</span></button>').join('') + '</div>';
  h += list.length ? '<div class="stack" style="gap:12px">' + list.map(inqCard).join('') + '</div>' : '<section class="panel"><div class="empty"><p>No inquiries here.</p><button class="btn primary sm" data-act="newInq">Log an inquiry</button></div></section>';
  return h;
};
function availabilityLine(date, guests) {
  if (!date) return '<span class="muted">No date given</span>';
  const ev = freeHalls(date, 'evening', guests), day = freeHalls(date, 'morning', guests);
  if (!ev.length && !day.length) return '<span class="pill bad wrap">Fully booked for ' + (guests || '') + ' guests</span>';
  return '<span class="pill ok wrap">Free: ' + esc([...new Set([...ev.map((x) => x.name + ' (evening)'), ...day.map((x) => x.name + ' (day)')])].slice(0, 4).join(', ')) + '</span>';
}
function inqCard(q) {
  const stCls = { new: 'warn', replied: 'info', converted: 'ok', lost: '' }[q.status];
  const stTxt = { new: 'New', replied: 'Replied', converted: 'Booked', lost: 'Lost' }[q.status];
  const open = S.ui.openInq === q.id;
  return '<section class="panel" id="inq-' + q.id + '"><div class="spread"><div class="row"><b style="font-size:1.02rem">' + esc(q.name) + '</b><span class="pill ' + stCls + '">' + stTxt + '</span><span class="pill">' + esc(q.source) + '</span></div><span class="small muted">' + ago(q.createdAt) + '</span></div>' +
    '<p style="margin:8px 0">' + esc(q.message || '') + '</p>' +
    '<div class="row small"><span>' + icon('cal', 14) + ' ' + (q.date ? fmtDate(q.date) : 'No date') + '</span><span>· ' + (q.guests || '?') + ' guests</span><span>· ' + esc(q.eventType || '') + '</span>' + (q.phone ? '<span>· ' + esc(q.phone) + '</span>' : '') + (q.email ? '<span>· ' + esc(q.email) + '</span>' : '') + '</div>' +
    '<div style="margin-top:8px">' + availabilityLine(q.date, q.guests) + '</div>' +
    (open || q.reply ? '<div class="stack" style="margin-top:12px" data-copy-wrap><div class="spread"><span class="label">Reply</span>' + '<span class="small muted">Drafted from your prices and calendar · edit before sending</span>' + '</div><textarea id="reply-' + q.id + '" data-inq-reply="' + q.id + '" rows="6" class="' + ((S.config.settings.msgLang === 'ur') ? '' : '') + '">' + esc(q.reply || '') + '</textarea></div>' : '') +
    '<div class="row" style="margin-top:12px">' +
    (q.status !== 'converted' && q.status !== 'lost' ? '<button class="btn plum sm" data-act="aiReply" data-id="' + q.id + '">' + icon('pen') + (q.reply ? 'Redraft reply' : 'Draft reply') + '</button>' : '') +
    (q.reply && q.phone ? '<a class="btn sm wa" target="_blank" rel="noopener" href="' + esc(waLink(q.phone, q.reply)) + '" data-act="markReplied" data-id="' + q.id + '">' + icon('wa') + 'WhatsApp</a>' : '') +
    (q.reply ? '<button class="btn sm" data-act="copyReply" data-id="' + q.id + '">' + icon('copy') + 'Copy</button>' : '') +
    (q.reply && q.status === 'new' ? '<button class="btn sm" data-act="markReplied" data-id="' + q.id + '">' + icon('check') + 'Mark replied</button>' : '') +
    (q.status !== 'converted' ? '<button class="btn primary sm" data-act="convertInq" data-id="' + q.id + '">' + icon('book') + 'Make booking</button>' : '') +
    '<span class="grow"></span>' +
    (q.status !== 'lost' && q.status !== 'converted' ? '<button class="btn ghost sm" data-act="lostInq" data-id="' + q.id + '">Mark lost</button>' : '') +
    '<button class="btn ghost sm" data-act="editInq" data-id="' + q.id + '" aria-label="Edit">' + icon('pen') + '</button>' +
    '<button class="btn ghost sm danger" data-act="delInq" data-id="' + q.id + '" aria-label="Delete">' + icon('trash') + '</button></div></section>';
}

/* ---------- Payments ---------- */
VIEWS.payments = function () {
  const t = todayISO(), m = t.slice(0, 7);
  const rows = S.bookings.map((b) => ({ b, p: payPlan(b) })).filter((x) => ['overdue', 'soon', 'ok'].includes(x.p.key)).sort((a, b) => a.p.due.localeCompare(b.p.due));
  const all = []; S.bookings.forEach((b) => (b.payments || []).forEach((p) => all.push({ b, p })));
  all.sort((a, b) => b.p.date.localeCompare(a.p.date));
  const collected = all.filter((x) => x.p.date.slice(0, 7) === m).reduce((s, x) => s + (+x.p.amount || 0), 0);
  const overdue = rows.filter((x) => x.p.key === 'overdue');
  let h = pageHead(tr('payments'), 'Deposits, balances and reminders. Reminders open WhatsApp with the message ready to send.');
  h += '<div class="kpis">' + kpi('Overdue', money(overdue.reduce((s, x) => s + x.p.amount, 0)), overdue.length + ' bookings late') +
    kpi('Due in 7 days', money(rows.filter((x) => x.p.key === 'soon').reduce((s, x) => s + x.p.amount, 0)), rows.filter((x) => x.p.key === 'soon').length + ' payments') +
    kpi('Collected this month', money(collected), all.filter((x) => x.p.date.slice(0, 7) === m).length + ' payments') +
    kpi('Total outstanding', money(rows.reduce((s, x) => s + x.p.c.balance, 0)), 'Across all live bookings') + '</div>';
  h += '<section class="panel"><div class="panel-head"><h2>Reminder queue</h2><span class="small muted">Message language: ' + ({ en: 'English', ur: 'Urdu', es: 'Spanish' }[S.config.settings.msgLang]) + ' · change in Settings</span></div>' +
    (rows.length ? '<div class="tbl-wrap"><table><thead><tr><th>Client</th><th>Event</th><th>What</th><th>Due</th><th class="r">Amount</th><th></th></tr></thead><tbody>' +
      rows.map(({ b, p }) => { const text = msg('reminder', vars(b, { amount: money(p.amount), due: fmtDate(p.due) })); return '<tr><td><b>' + esc(b.customer.name) + '</b><div class="small muted">' + esc(b.customer.phone || '') + '</div></td><td>' + fmtShort(b.date) + '<div class="small muted">' + esc(b.code) + '</div></td><td>' + p.label + '</td><td>' + (p.key === 'overdue' ? '<span class="pill bad">' + fmtShort(p.due) + '</span>' : p.key === 'soon' ? '<span class="pill warn">' + fmtShort(p.due) + '</span>' : fmtShort(p.due)) + '</td><td class="r money">' + money(p.amount) + '</td><td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">' + (b.customer.phone ? '<a class="btn sm wa" target="_blank" rel="noopener" href="' + esc(waLink(b.customer.phone, text)) + '" data-act="logReminder" data-id="' + b.id + '">' + icon('wa') + 'Remind</a>' : '') + '<button class="btn sm" data-act="addPay" data-id="' + b.id + '">' + icon('plus') + 'Payment</button></div>' + (b.lastReminder ? '<div class="small muted" style="text-align:right">Reminded ' + ago(b.lastReminder) + '</div>' : '') + '</td></tr>'; }).join('') +
      '</tbody></table></div>' : '<div class="empty">' + icon('check', 28) + '<p>No payments are due. Everyone is paid up.</p></div>') + '</section>';
  h += '<section class="panel"><div class="panel-head"><h2>Payments received</h2></div>' +
    (all.length ? '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Method</th><th class="r">Amount</th><th></th></tr></thead><tbody>' +
      all.slice(0, 25).map(({ b, p }) => '<tr><td>' + fmtDate(p.date) + '</td><td><b>' + esc(b.customer.name) + '</b><div class="small muted">' + esc(b.code) + '</div></td><td>' + esc(p.method) + (p.note ? '<div class="small muted">' + esc(p.note) + '</div>' : '') + '</td><td class="r money">' + money(p.amount) + '</td><td class="r"><button class="btn sm ghost" data-act="receipt" data-id="' + b.id + '" data-pid="' + p.id + '">Receipt</button></td></tr>').join('') +
      '</tbody></table></div>' : '<div class="empty"><p>No payments recorded yet.</p></div>') + '</section>';
  return h;
};

/* ---------- Vendors ---------- */

/* ---------- Event day ---------- */
VIEWS.eventday = function () {
  const t = todayISO();
  if (!S.ui.eventDate) { const nx = S.bookings.filter((b) => b.date >= t && effStatus(b) === 'confirmed').sort((a, b) => a.date.localeCompare(b.date))[0]; S.ui.eventDate = nx ? nx.date : t; }
  const day = S.ui.eventDate;
  const list = S.bookings.filter((b) => b.date === day && ['confirmed', 'completed', 'hold'].includes(effStatus(b))).sort((a, b) => a.slot.localeCompare(b.slot));
  let h = pageHead(tr('eventday'), fmtDate(day) + (day === t ? ' · today' : ''), '<button class="btn" data-act="evNav" data-n="-1" aria-label="Previous day">' + icon('left') + '</button><input type="date" id="evDate" value="' + day + '" style="width:auto"><button class="btn" data-act="evNav" data-n="1" aria-label="Next day">' + icon('right') + '</button><button class="btn" data-act="evNext">Next event</button>');
  if (!list.length) return h + '<section class="panel"><div class="empty"><p>No events on this day.</p><button class="btn sm" data-act="evNext">Jump to the next event</button></div></section>';
  h += list.map((b) => {
    const c = calc(b), cl = (b.checklist || []).slice().sort((x, y) => (x.time || '').localeCompare(y.time || ''));
    const done = cl.filter((x) => x.done).length, pct = cl.length ? Math.round(100 * done / cl.length) : 0;
    return '<section class="panel"><div class="spread"><div><h2>' + esc(b.customer.name) + ' · ' + esc(b.eventType) + '</h2><p class="muted small"><span class="dot" style="background:' + esc(c.hall?.color || '#888') + '"></span> ' + esc(c.hall?.name || '') + ' · ' + SLOT_NAMES[b.slot] + ' ' + esc(S.config.settings.slots[b.slot]) + ' · ' + b.guests + ' guests · ' + esc(c.pkg?.name || '') + ' package</p></div><div class="row">' + statusPill(b) + '<button class="btn sm" data-act="openBk" data-id="' + b.id + '">Open booking</button></div></div>' +
      '<div class="grid2" style="margin-top:12px"><div class="stack"><div class="spread"><span class="label">Checklist</span><span class="small num">' + done + ' / ' + cl.length + '</span></div><div class="progress"><i style="width:' + pct + '%"></i></div>' +
      (cl.length ? cl.map((x) => taskRow(b, x)).join('') : '<p class="small muted">No checklist yet.</p><button class="btn sm" data-act="genChecklist" data-id="' + b.id + '">Create standard checklist</button>') +
      '</div><div class="stack"><span class="label">Contacts</span>' +
      '<div class="li"><div class="grow"><p><b>' + esc(b.customer.name) + '</b> · client</p><p class="small muted num">' + esc(b.customer.phone || '') + '</p></div></div>' +

/* ---------- Reports ---------- */
VIEWS.reports = function () {
  const yr = S.ui.reportYear || +todayISO().slice(0, 4); S.ui.reportYear = yr;
  const live = S.bookings.filter((b) => b.date?.startsWith(String(yr)) && !['cancelled', 'expired'].includes(effStatus(b)));
  const pays = []; S.bookings.forEach((b) => (b.payments || []).forEach((p) => { if (p.date?.startsWith(String(yr))) pays.push(p); }));
  const booked = live.reduce((s, b) => s + calc(b).total, 0), coll = pays.reduce((s, p) => s + (+p.amount || 0), 0);
  const byMonth = MO.map((_, i) => { const k = yr + '-' + String(i + 1).padStart(2, '0'); return { b: live.filter((x) => x.date.slice(0, 7) === k).reduce((s, x) => s + calc(x).total, 0), c: pays.filter((p) => p.date.slice(0, 7) === k).reduce((s, p) => s + (+p.amount || 0), 0) }; });
  const group = (keyFn, valFn) => { const m = {}; live.forEach((b) => { const k = keyFn(b); if (!k) return; m[k] = (m[k] || 0) + valFn(b); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const byPkg = group((b) => pkgById(b.packageId)?.name, (b) => calc(b).total);
  const bySrc = group((b) => b.source || 'Other', () => 1);
  const byType = group((b) => b.eventType, () => 1);
  const byHall = group((b) => hallById(b.hallId)?.name, (b) => calc(b).total);
  const addRev = {}; live.forEach((b) => calc(b).addLines.forEach((a) => { addRev[a.name] = (addRev[a.name] || 0) + a.amt; }));
  const byAdd = Object.entries(addRev).sort((a, b) => b[1] - a[1]);
  const wd = WD.map(() => 0); live.forEach((b) => wd[parseISO(b.date).getDay()]++);
  // Evening occupancy for the year so far (or full year if past)
  const start = yr + '-01-01', end = String(yr) === todayISO().slice(0, 4) ? todayISO() : yr + '-12-31';
  const days = Math.max(1, daysBetween(start, end) + 1);
  const evSlots = days * Math.max(1, S.config.halls.length);
  const evUsed = live.filter((b) => b.date <= end && (b.slot === 'evening' || b.slot === 'full')).length;
  const inqYr = S.inquiries.filter((q) => q.createdAt.startsWith(String(yr)));
  let h = pageHead(tr('reports'), 'How the venue is doing in ' + yr + '.', '<button class="btn" data-act="repYear" data-n="-1" aria-label="Previous year">' + icon('left') + '</button><span class="num">' + yr + '</span><button class="btn" data-act="repYear" data-n="1" aria-label="Next year">' + icon('right') + '</button>');
  h += '<div class="kpis">' + kpi('Booked value', money(booked), live.length + ' events') + kpi('Collected', money(coll), pays.length + ' payments') + kpi('Average event', money(live.length ? booked / live.length : 0), 'Total per booking') + kpi('Evening occupancy', Math.round(100 * evUsed / evSlots) + '%', evUsed + ' of ' + evSlots + ' hall-evenings to date') + '</div>';
  h += '<section class="panel chart"><div class="panel-head"><h2>Month by month</h2><div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Booked value</span><span><i class="dot" style="background:var(--sun)"></i>Collected</span></div></div>' + monthChart(byMonth) + '</section>';
  h += '<div class="grid2">' + barPanel('Revenue by package', byPkg, money) + barPanel('Revenue by hall', byHall, money) + barPanel('Add-on revenue (upsells)', byAdd, money) + barPanel('Where bookings come from', bySrc, (v) => v + ' bookings') + barPanel('Event types', byType, (v) => v + ' events') + barPanel('Busiest days of the week', WD.map((w, i) => [w, wd[i]]), (v) => v + ' events', true) + '</div>';
  h += '<section class="panel"><div class="panel-head"><h2>Inquiry funnel</h2></div><div class="bars">' + [['Received', inqYr.length], ['Replied', inqYr.filter((q) => q.repliedAt || ['replied', 'converted'].includes(q.status)).length], ['Booked', inqYr.filter((q) => q.status === 'converted').length], ['Lost', inqYr.filter((q) => q.status === 'lost').length]].map(([k, v]) => barRow(k, v, Math.max(1, inqYr.length), v + '')).join('') + '</div></section>';
  return h;
};
function barRow(label, v, max, txt) { return '<div class="bar"><span>' + esc(label) + '</span><div class="track"><i style="width:' + Math.round(100 * v / (max || 1)) + '%"></i></div><span class="num small">' + esc(txt) + '</span></div>'; }
function barPanel(title, rows, f, keepOrder) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return '<section class="panel"><div class="panel-head"><h3>' + esc(title) + '</h3></div>' + (rows.length && rows.some((r) => r[1]) ? '<div class="bars">' + rows.slice(0, keepOrder ? 7 : 6).map(([k, v]) => barRow(k, v, max, f(v))).join('') + '</div>' : '<p class="muted small">No data yet.</p>') + '</section>';
}
function monthChart(data) {
  const W = 720, H = 240, pl = 64, pr = 10, pt = 12, pb = 28;
  const max = Math.max(1, ...data.map((d) => Math.max(d.b, d.c)));
  const nice = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
  const top = nice(max), y = (v) => pt + (H - pt - pb) * (1 - v / top);
  const bw = (W - pl - pr) / 12;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Booked value and collected payments by month">';
  for (let i = 0; i <= 4; i++) { const v = top * i / 4, yy = y(v); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/><text x="' + (pl - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">' + esc(shortMoney(v)) + '</text>'; }
  data.forEach((d, i) => {
    const x = pl + i * bw, w = Math.max(4, bw * 0.32);
    s += '<rect x="' + (x + bw * 0.16) + '" y="' + y(d.b) + '" width="' + w + '" height="' + (y(0) - y(d.b)) + '" rx="2" fill="var(--accent)"><title>' + MO[i] + ' booked ' + esc(money(d.b)) + '</title></rect>';
    s += '<rect x="' + (x + bw * 0.16 + w + 2) + '" y="' + y(d.c) + '" width="' + w + '" height="' + (y(0) - y(d.c)) + '" rx="2" fill="var(--sun)"><title>' + MO[i] + ' collected ' + esc(money(d.c)) + '</title></rect>';
    s += '<text x="' + (x + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + MO[i] + '</text>';
  });
  return '<div class="tbl-wrap">' + s + '</svg></div>';
}

async function pinHash(id, pin) {
  const data = new TextEncoder().encode('vd:' + id + ':' + pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function sessionGet() { try { return sessionStorage.getItem('vd-session') || ''; } catch (e) { return ''; } }
function sessionSet(id) { try { if (id) sessionStorage.setItem('vd-session', id); else sessionStorage.removeItem('vd-session'); } catch (e) {} }
function seenGet(uid) { try { return localStorage.getItem('vd-seen-' + uid) || ''; } catch (e) { return ''; } }
function seenSet(uid) { try { localStorage.setItem('vd-seen-' + uid, new Date().toISOString()); } catch (e) {} }

function permCSS() {
  let el = document.getElementById('permcss');
  if (!el) { el = document.createElement('style'); el.id = 'permcss'; document.head.appendChild(el); }

  }

function initials(n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase(); }
async function doLogin(fd) {
  const u = userById(LOGIN.pick); if (!u) return;
  if (Date.now() < LOGIN.until) return;
  const pin = String(fd.get('pin') || '');
  const ok = u.pinHash ? (await pinHash(u.id, pin)) === u.pinHash : (u.demoPin && pin === u.demoPin);
  if (!ok) { LOGIN.fails++; if (LOGIN.fails >= 5) { LOGIN.until = Date.now() + 60000; LOGIN.fails = 0; setTimeout(renderLogin, 60500); } toast('Wrong PIN', true); renderLogin(); return; }
  LOGIN.fails = 0; startSession(u);
}
function startSession(u) {
  S.user = u; sessionSet(u.id); LOGIN.pick = '';
  const saved = location.hash.slice(1);
  S.route = canView(saved) ? saved : ROLES[u.role].home;
  S.drawer = null; S.modal = null; lastActive = Date.now();
  permCSS(); refresh();
  const al = alertsFor(u);
  notified = new Set(al.map((a) => a.key));
  const fresh = al.filter((a) => a.sev !== 'info' || a.isNew);
  if (fresh.length && !can('settings')) openDrawer({ type: 'alerts' });

}
function lockApp() { S.user = null; sessionSet(''); S.drawer = null; S.modal = null; permCSS(); renderLogin(); }
let lastActive = Date.now(), notified = new Set();
['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => { lastActive = Date.now(); }, true));

/* ---------- alerts ---------- */
function myEvents(u, from, to) {
  return S.bookings.filter((b) => (b.staff || []).includes(u.id) && b.date >= from && b.date <= to && ['confirmed', 'hold'].includes(effStatus(b))).sort((a, b) => (a.date + a.slot).localeCompare(b.date + b.slot));
}
function myTasks(u) { return S.tasks.filter((x) => x.assignee === u.id); }
function myChecklist(u) {
  const out = [];
  S.bookings.forEach((b) => { if (!['confirmed', 'hold', 'completed'].includes(effStatus(b))) return; (b.checklist || []).forEach((c) => { if (c.assignee === u.id) out.push({ b, c }); }); });
  return out;
}
function alertsFor(u) {
  if (!u) return [];
  const t = todayISO(), tm = addDays(t, 1), seen = seenGet(u.id), out = [];
  const slotTime = (b) => S.config.settings.slots[b.slot] || '';
  myEvents(u, t, tm).forEach((b) => out.push({ key: 'ev' + b.id + b.date, sev: b.date === t ? 'warn' : 'info', icon: 'cal', text: (b.date === t ? 'Event today: ' : 'Tomorrow: ') + '<b>' + esc(b.customer.name) + '</b> · ' + esc(b.eventType), meta: (hallById(b.hallId)?.name || '') + ' · ' + slotTime(b) + ' · ' + b.guests + ' guests', act: 'openBk', id: b.id, tab: 'checklist' }));
  myTasks(u).filter((x) => !x.done).forEach((x) => {
    const over = x.due && x.due < t, today = x.due === t, isNew = !seen || x.createdAt > seen;
    if (over || today || isNew) out.push({ key: 'tk' + x.id + (over ? 'o' : today ? 't' : 'n'), isNew, sev: over ? 'bad' : today ? 'warn' : 'info', icon: 'check', text: (over ? 'Overdue: ' : today ? 'Due today: ' : 'New task: ') + '<b>' + esc(x.title) + '</b>', meta: (x.due ? fmtShort(x.due) + (x.time ? ' ' + x.time : '') : 'No date') + ' · from ' + esc(userName(x.createdBy)) + (x.priority === 'urgent' ? ' · URGENT' : ''), act: 'go', r: 'mywork' });
  });
  myChecklist(u).filter(({ b, c }) => !c.done && (b.date === t || b.date === tm || b.date < t)).forEach(({ b, c }) => out.push({ key: 'cl' + c.id, sev: b.date < t ? 'bad' : b.date === t ? 'warn' : 'info', icon: 'list', text: (b.date === tm ? 'Tomorrow, ' : '') + (c.time ? c.time + ' · ' : '') + '<b>' + esc(c.task) + '</b>', meta: esc(b.customer.name) + ' · ' + fmtShort(b.date), act: 'openBk', id: b.id, tab: 'checklist' }));
  if (can('edit') || can('money')) attentionItems().forEach((a) => { if (!can('edit') && a.icon !== 'cash') return; out.push(Object.assign({ key: 'at' + a.act + a.id + a.icon }, a)); });
  const order = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

function checkLiveAlerts() {
  if (!S.user) return;
  const al = alertsFor(S.user);

  const done = tasks.filter((x) => x.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '')).slice(0, 6);

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast('That file is not a VenueDesk backup.', true); }
  if (!data || !data.config || !Array.isArray(data.bookings)) return toast('That file is not a VenueDesk backup.', true);
  ask('Restore backup?', 'This replaces all current bookings, inquiries and settings with the ' + data.bookings.length + ' bookings in the file.', 'Restore', async () => {
    for (const b of S.bookings.slice()) Store.deleteBooking(b.id);
    for (const q of S.inquiries.slice()) Store.deleteInquiry(q.id);
    for (const x of S.tasks.slice()) Store.deleteTask(x.id);
    S.config = normalizeConfig(data.config); Store.saveConfig();
    for (const b of data.bookings) Store.saveBooking(b);
    for (const q of (data.inquiries || [])) Store.saveInquiry(q);
    for (const x of (data.tasks || [])) Store.saveTask(x);
    if (!(S.config.users || []).some((u) => u.id === S.user.id && u.role === 'admin')) { S.config.users = (S.config.users || []).concat(clone(S.user)); Store.saveConfig(); }
    toast('Backup restored'); refresh();
  }, true);
}

/* ---------- signature pad ---------- */
function setupSigpad() {
  const cv = $('#sigpad'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const ratio = Math.max(1, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * ratio); cv.height = Math.round(r.height * ratio);
  ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1c1925';
  let drawing = false; cv.dataset.inked = '';
  const pos = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', (e) => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  cv.addEventListener('pointermove', (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); cv.dataset.inked = '1'; });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function signatureData() {
  const cv = $('#sigpad'); if (!cv || !cv.dataset.inked) return '';
  const out = document.createElement('canvas'); out.width = 360; out.height = 104;
  const c2 = out.getContext('2d'); c2.fillStyle = '#ffffff'; c2.fillRect(0, 0, out.width, out.height); c2.drawImage(cv, 0, 0, out.width, out.height);
  return out.toDataURL('image/jpeg', 0.7);
}

  delVendor: (el) => ask('Remove this vendor?', 'They will be unassigned from future events.', 'Remove', () => { S.config.vendors = S.config.vendors.filter((x) => x.id !== el.dataset.id); Store.saveConfig(); refresh(); }, true),

  addRow: (el) => {
    const k = el.dataset.list;
    const blank = { halls: { id: uid('h_'), name: 'New hall', capacity: 300, rent: 50000, color: '#c0392b' }, packages: { id: uid('p_'), name: 'New package', type: 'perHead', price: 1500, includes: '' }, addons: { id: uid('a_'), name: 'New add-on', unit: 'flat', price: 10000, pitch: '' } }[k];
    S.config[k].push(blank); Store.saveConfig(); renderView();
  },
  delRow: (el) => {
    const k = el.dataset.list, i = +el.dataset.i, row = S.config[k][i];
    const used = S.bookings.some((b) => (k === 'halls' && b.hallId === row.id) || (k === 'packages' && b.packageId === row.id) || (k === 'addons' && (b.addons || []).some((a) => a.id === row.id)));
    if (k === 'halls' && S.config.halls.length === 1) return toast('Keep at least one hall.', true);
    ask('Remove ' + row.name + '?', used ? 'Existing bookings still use it; their prices will lose this line.' : 'It will no longer appear in new bookings.', 'Remove', () => { S.config[k].splice(i, 1); Store.saveConfig(); renderView(); }, true);
  },
  exportJson: () => Store.download('venuedesk-backup-' + todayISO() + '.json', JSON.stringify({ app: 'Soft2Cloud VenueDesk', version: 1, exportedAt: new Date().toISOString(), config: S.config, tasks: S.tasks, bookings: S.bookings, inquiries: S.inquiries }, null, 2)),
  exportCsv: () => exportCsv(),
  clearDemo: () => ask('Clear the sample data?', 'Example bookings and inquiries are removed. The sample halls, packages and prices stay so you can edit them into your own.', 'Clear samples', () => {
    S.bookings.filter((b) => b.demo).forEach((b) => Store.deleteBooking(b.id));
    S.inquiries.filter((q) => q.demo).forEach((q) => Store.deleteInquiry(q.id));
    S.tasks.filter((x) => x.demo).forEach((x) => Store.deleteTask(x.id));
    S.config.users = S.config.users.filter((u) => !u.demo || u.id === S.user.id);
    S.config.demo = false; Store.saveConfig(); toast('Samples cleared. Now set your halls and prices in Settings.'); S.route = 'setup'; S.ui.setTab = 'venue'; refresh();
  }),
  eraseAll: () => ask('Erase everything?', 'All bookings, inquiries, vendors and settings are deleted. Download a backup first if you might need them.', 'Erase all', () => {
    S.bookings.slice().forEach((b) => Store.deleteBooking(b.id)); S.inquiries.slice().forEach((q) => Store.deleteInquiry(q.id));
    S.tasks.slice().forEach((x) => Store.deleteTask(x.id));
    const keep = clone(S.user); S.config = normalizeConfig(defaultConfig()); S.config.users = [keep]; Store.saveConfig(); toast('All data erased. Your admin login is kept.'); refresh();
  }, true),
  confirmYes: () => { const fn = S.modal.onYes; S.modal = null; renderLayer(); fn && fn(); },


  siteHold: (el) => { S.ui.siteResult.holdHall = el.dataset.h; renderView(); $('#siteBook')?.scrollIntoView({ block: 'center' }); },
  siteCancel: () => { S.ui.siteResult.holdHall = null; renderView(); },
  copySite: (el) => { const st = S.config.settings; copyText('Check dates and book ' + st.venueName + ' online, any time. Live availability for ' + S.config.halls.map((h) => h.name).join(', ') + '. Hold your date in one minute.', el); },
  portalOut: () => { S.ui.portalId = null; renderView(); },
  pickUser: (el) => { LOGIN.pick = el.dataset.id; renderLogin(); },
  lock: () => lockApp(),
  openAlerts: () => openDrawer({ type: 'alerts' }),
  toggleStaff: (el) => { const b = bookingById(el.dataset.id), u = el.dataset.uid; b.staff = el.checked ? [...new Set([...(b.staff || []), u])] : (b.staff || []).filter((x) => x !== u); Store.saveBooking(b); toast(el.checked ? userName(u) + ' added to this event' : userName(u) + ' removed'); renderLayer(); },
  toggleTeamTask: (el) => { const x = S.tasks.find((y) => y.id === el.dataset.id); if (!x) return; if (x.assignee !== S.user.id && !can('assign')) { toast('Only the assigned person can tick this.', true); el.checked = !el.checked; return; } x.done = el.checked; x.doneBy = el.checked ? S.user.id : ''; x.doneAt = el.checked ? new Date().toISOString() : ''; Store.saveTask(x); if (el.checked) toast('Done. ' + (userName(x.createdBy) !== S.user.name ? userName(x.createdBy) + ' will see it.' : '')); refresh(); },
  doneTeamTask: (el) => { const x = S.tasks.find((y) => y.id === el.dataset.id); x.done = true; x.doneBy = S.user.id; x.doneAt = new Date().toISOString(); Store.saveTask(x); refresh(); },
  delTeamTask: (el) => ask('Delete this task?', 'It disappears from the person’s list.', 'Delete', () => { Store.deleteTask(el.dataset.id); refresh(); }, true),
  editUser: (el) => { const u = el.dataset.id ? userById(el.dataset.id) : null; openModal({ type: 'user', narrow: true, editId: u?.id, draft: u ? clone(u) : { id: uid('u_'), name: '', role: 'staff', phone: '', active: true } }); },
  saveUser: async () => {
    const f = $('#userForm'); if (!f.reportValidity()) return;
    const fd = new FormData(f), u = S.modal.draft, mine = u.id === S.user.id;
    u.name = (fd.get('name') || '').trim(); u.phone = (fd.get('phone') || '').trim();
    if (!mine) { u.role = fd.get('role'); if (S.modal.editId) u.active = !!fd.get('active'); }
    const pin = String(fd.get('pin') || '');
    if (pin) { u.pinHash = await pinHash(u.id, pin); delete u.demoPin; }
    const users = S.config.users; const i = users.findIndex((x) => x.id === u.id);
    if (i >= 0) users[i] = u; else users.push(u);
    if (!users.some((x) => x.role === 'admin' && x.active !== false)) return toast('Keep at least one active admin.', true);
    Store.saveConfig(); if (mine) S.user = u; S.modal = null; toast(S.modal === null && i < 0 ? u.name + ' can now sign in' : 'Saved'); refresh();
  },
  delUser: (el) => { const u = userById(el.dataset.id); if (u.role === 'admin' && S.config.users.filter((x) => x.role === 'admin').length < 2) return toast('Keep at least one admin.', true); ask('Remove ' + u.name + '?', 'Their login stops working. Tasks they finished stay in the history.', 'Remove', () => { S.config.users = S.config.users.filter((x) => x.id !== u.id); Store.saveConfig(); refresh(); }, true); }
};

/* ---------- global listeners ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; if (!A[act]) return;
  if (NEED[act] && !can(NEED[act])) { e.preventDefault(); toast('Your login cannot do this. Ask the admin.', true); return; }
  if (el.tagName === 'A') { A[act](el, e); return; } // let links open
  if (el.type === 'checkbox') { A[act](el, e); return; }
  e.preventDefault(); A[act](el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.modal) closeModal(); else if (S.drawer) { S.drawer = null; renderLayer(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.cal .day')) { e.preventDefault(); A.openDay(e.target); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.closest('#bkForm')) updateBookingSummary();
  if (el.dataset.inqReply) { const q = S.inquiries.find((x) => x.id === el.dataset.inqReply); if (q) { q.reply = el.value; clearTimeout(el._t); el._t = setTimeout(() => Store.saveInquiry(q), 700); } }
  if (el.dataset.set) {
    const path = el.dataset.set.split('.'); let o = S.config; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    let v = el.value; if (el.dataset.lines) v = v.split('\n'); else if (el.type === 'number') v = +v || 0;
    o[path[path.length - 1]] = v;
    clearTimeout(settingsTimer); settingsTimer = setTimeout(() => { Store.saveConfig(); renderShell(); renderView(); }, el.tagName === 'SELECT' ? 0 : 900);
  }
  if (el.dataset.list) {
    const row = S.config[el.dataset.list][+el.dataset.i]; row[el.dataset.f] = el.type === 'number' ? (+el.value || 0) : el.value;
    clearTimeout(settingsTimer); settingsTimer = setTimeout(() => Store.saveConfig(), 900);
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.list && el.tagName === 'SELECT') { S.config[el.dataset.list][+el.dataset.i][el.dataset.f] = el.value; Store.saveConfig(); }
  if (el.dataset.set && el.tagName === 'SELECT') { clearTimeout(settingsTimer); Store.saveConfig(); refresh(); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f);
  if (f.id === 'taskForm') {
    const b = bookingById(f.dataset.id);
    b.checklist = (b.checklist || []).concat({ id: uid('c_'), time: fd.get('time') || '', task: fd.get('task').trim(), owner: (fd.get('owner') || '').trim(), assignee: fd.get('assignee') || '', done: false });
    Store.saveBooking(b); refresh();
  }
  if (f.id === 'siteCheck') {
    S.ui.siteForm = { date: fd.get('date'), slot: fd.get('slot'), guests: +fd.get('guests') || 0 };
    S.ui.siteResult = { date: fd.get('date'), slot: fd.get('slot'), guests: +fd.get('guests') || 0, halls: freeHalls(fd.get('date'), fd.get('slot'), +fd.get('guests') || 0) };
    renderView();
  }
  if (f.id === 'siteBook') {
    const r = S.ui.siteResult;
    const b = newBookingDraft({ customer: { name: fd.get('name').trim(), phone: fd.get('phone').trim(), email: (fd.get('email') || '').trim() }, eventType: fd.get('eventType'), packageId: fd.get('packageId'), date: r.date, slot: r.slot, guests: r.guests, hallId: r.holdHall, source: 'Website', status: 'hold', holdUntil: new Date(Date.now() + S.config.settings.holdHours * 3600e3).toISOString() });
    if (conflictsFor(b).length) { toast('Someone just took that slot. Check again.', true); return; }
    Store.saveBooking(b);
    S.ui.siteResult = { date: r.date, guests: r.guests, halls: [], booked: b.code };
    toast('New website booking: ' + b.code); refresh();
  }
  if (f.id === 'loginForm') { doLogin(fd); return; }
  if (f.id === 'adminSetup') {
    const pin = String(fd.get('pin')), pin2 = String(fd.get('pin2'));
    if (pin !== pin2) return toast('The two PINs do not match.', true);
    (async () => { const u = { id: uid('u_'), name: String(fd.get('name')).trim() || 'Admin', role: 'admin', phone: '', active: true, createdAt: new Date().toISOString() }; u.pinHash = await pinHash(u.id, pin); S.config.users = (S.config.users || []).concat(u); Store.saveConfig(); toast('Admin created'); startSession(u); })();
    return;
  }
  if (f.id === 'teamTaskForm') {
    const x = { id: uid('t_'), title: String(fd.get('title')).trim(), assignee: fd.get('assignee'), due: fd.get('due') || '', time: fd.get('time') || '', bookingId: fd.get('bookingId') || '', priority: fd.get('priority'), notes: String(fd.get('notes') || '').trim(), done: false, createdBy: S.user.id, createdAt: new Date().toISOString() };
    if (!x.title || !x.assignee) return;
    Store.saveTask(x); toast('Task sent to ' + userName(x.assignee)); refresh(); return;
  }
  if (f.id === 'portalLogin') {
    const code = (fd.get('code') || '').trim().toUpperCase(), last4 = String(fd.get('phone') || '').trim();
    S.ui.portalCode = code;
    const b = S.bookings.find((x) => (x.code || '').toUpperCase() === code && String(x.customer.phone || '').replace(/\D/g, '').endsWith(last4) && last4.length === 4);
    if (!b) return toast('No booking matches that code and phone.', true);
    S.ui.portalId = b.id; renderView();
  }
  if (f.id === 'guestReq') {
    const b = bookingById(S.ui.portalId); const g = +fd.get('guests');
    if (g && g !== +b.guests) { b.guestRequest = { guests: g, at: new Date().toISOString() }; Store.saveBooking(b); toast('Request sent to the venue'); refresh(); }
  }
});
window.addEventListener('hashchange', () => { if (!S.user) return; const h = location.hash.slice(1); if (HASHES.includes(h) && h !== S.route) go(h); });
setInterval(() => { if (Store.ready && S.user && !S.modal && !S.drawer && !document.activeElement?.matches('input,textarea,select')) { renderShell(); renderView(); renderLayer(); } }, 60000); // keep hold timers fresh

function boot() {
  const h = location.hash.slice(1);
  const sid = sessionGet(); const u = sid ? userById(sid) : null;
  if (u && u.active !== false) { S.user = u; S.route = HASHES.includes(h) && canView(h) ? h : ROLES[u.role].home; notified = new Set(alertsFor(u).map((a) => a.key)); refresh(); }
  else renderLogin();
}
Store.init();

</script>
